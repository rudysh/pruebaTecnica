services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: consulta-articulos-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: consulta-articulos-database-init

    depends_on:
      sqlserver:
        condition: service_healthy

    environment:
      DB_PASSWORD: "${DB_PASSWORD}"

    volumes:
      - ./Database/init.sql:/scripts/init.sql:ro

    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "$$DB_PASSWORD" \
          -C \
          -i /scripts/init.sql

    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: consulta-articulos-app

    depends_on:
      database-init:
        condition: service_completed_successfully

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ArticulosDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=False"

    ports:
      - "8080:8080"

volumes:
  sqlserver-data: